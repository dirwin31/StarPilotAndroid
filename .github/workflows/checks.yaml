name: Android checks
on:
  pull_request:
    branches: [Play-Dev, Direct-Dev, Play-Distro, Direct-Distro]
  push:
    branches: [AA-Play-Dev, Play-Dev, Direct-Dev, Play-Distro, Direct-Distro]
permissions:
  contents: read
jobs:
  companion:
    if: github.ref_name == 'AA-Play-Dev' || github.base_ref == 'AA-Play-Dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and lint companion
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:bundleRelease
  tooling:
    if: github.ref_name != 'AA-Play-Dev' && github.base_ref != 'AA-Play-Dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_starpilot_cli.py'
  flavors:
    if: github.ref_name != 'AA-Play-Dev' && github.base_ref != 'AA-Play-Dev'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Direct, Play]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Test and lint the flavor
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: ./gradlew --no-daemon --max-workers=1 "test${FLAVOR}DebugUnitTest" "lint${FLAVOR}Release"
      - name: Check distribution permissions
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q tests/test_android_manifest.py
