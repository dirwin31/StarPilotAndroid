name: Android checks
on:
  pull_request:
    branches: [Play-Dev, Play-Distro]
  push:
    branches: [Play-Dev, Play-Distro]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_starpilot_cli.py'
  flavors:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Play]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Test and lint the flavor
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: ./gradlew --no-daemon --max-workers=1 "test${FLAVOR}DebugUnitTest" "lint${FLAVOR}Release"
      - name: Check distribution permissions
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q tests/test_android_manifest.py
      - name: Check packaged QR scanner dependencies
        if: matrix.flavor == 'Play'
        run: |
          ./gradlew --no-daemon --max-workers=1 assemblePlayDebug
          python3 -m pytest -q tests/test_scanner_apk.py
