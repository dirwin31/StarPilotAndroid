name: Android Auto companion build
on:
  push:
    branches: [AA-Play-Dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore companion upload key
        env:
          UPLOAD_KEY: ${{ secrets.COMPANION_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$UPLOAD_KEY"
          printf '%s' "$UPLOAD_KEY" | base64 -d > "$RUNNER_TEMP/companion-upload.jks"
      - name: Build independent companion bundle
        env:
          COMPANION_UPLOAD_KEYSTORE: ${{ runner.temp }}/companion-upload.jks
          COMPANION_UPLOAD_KEY_PASSWORD: ${{ secrets.COMPANION_UPLOAD_KEY_PASSWORD }}
          AA_PRIMARY_CERT_SHA256: ${{ secrets.AA_PRIMARY_CERT_SHA256 }}
        run: |
          test -n "$AA_PRIMARY_CERT_SHA256"
          ./gradlew :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-auto-companion
          path: app/build/outputs/bundle/release/*.aab
